name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run i18n -- --check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/shots
          retention-days: 14

  docker:
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t lostcomma-site .
      - name: smoke test the image
        run: |
          docker run -d --name web -p 3000:3000 -e SITE_URL=http://localhost:3000 lostcomma-site
          for i in $(seq 1 20); do curl -fsS localhost:3000/healthz && break; sleep 1; done
          curl -fsS -o /dev/null -w "%{http_code}\n" localhost:3000/en
          curl -fsS -o /dev/null -w "%{http_code}\n" localhost:3000/tr/isler
          docker logs web
